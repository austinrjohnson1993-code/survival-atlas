<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Survival Atlas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d5c40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>
html{background:#eef2ee;color:#17211d;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){html{background:#101814;color:#e5ebe7}}
body{margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.box{max-width:420px;text-align:center}
h1{font-size:22px;margin:0 0 6px;color:#0d5c40}@media (prefers-color-scheme:dark){h1{color:#8ab9ee}}
.bar{height:10px;border-radius:5px;background:rgba(127,127,127,.25);overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;width:0;background:#f2a900;transition:width .2s}
p{margin:8px 0}.small{font-size:13.5px;opacity:.8}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid #0d5c40;background:#0d5c40;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Survival Atlas</h1>
  <p id="msg">Loading the atlas (about 29 MB). On Wi-Fi this takes a few seconds; on a weak cell signal a minute or two. After the first load it opens with no signal at all.</p>
  <div class="bar"><i id="fill"></i></div>
  <p class="small" id="sub"></p>
</div>
<script>
(async function () {
  var SRC = 'https://ieimwwhvrbujgnovvrrc.supabase.co/functions/v1/atlas/Survival-Atlas.html'; // the atlas itself; the service worker keeps a copy so it opens offline
  var fill = document.getElementById('fill'), msg = document.getElementById('msg'), sub = document.getElementById('sub');
  if ('serviceWorker' in navigator) { try { await navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  function fail(why) {
    msg.textContent = 'Could not load the atlas: ' + why + '. If you are offline, this phone has not stored the atlas yet; connect to Wi-Fi once and reopen it.';
    var b = document.createElement('button'); b.textContent = 'Try again'; b.onclick = function () { location.reload(); }; document.getElementById('box').appendChild(b);
  }
  try {
    var r = await fetch(SRC, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var total = +r.headers.get('content-length') || 0, got = 0, chunks = [];
    var reader = r.body.getReader();
    while (true) { var c = await reader.read(); if (c.done) break; chunks.push(c.value); got += c.value.length; if (total) fill.style.width = Math.round(100 * got / total) + '%'; sub.textContent = (got / 1e6).toFixed(1) + ' MB'; }
    var html = new TextDecoder('utf-8').decode(concat(chunks, got));
    if (html.length < 1e6 || html.indexOf('tab-start') < 0) throw new Error('file incomplete');
    fill.style.width = '100%'; sub.textContent = 'Opening…';
    // the downloaded file is the single-file edition; give it the app's manifest, icons and the offline/update notices
    var head = '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d5c40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Atlas"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">';
    var pwa = '<script id="fsa-pwa">(' + String(pwaScript) + ')(' + JSON.stringify(SRC) + ');<\/script>';
    html = html.replace('</title>', '</title>' + head);
    html = html.replace('</body>', pwa + '</body>');
    await new Promise(function (res) { setTimeout(res, 30); });
    document.open(); document.write(html); document.close();
  } catch (e) { fail(e && e.message ? e.message : String(e)); }
  // runs inside the atlas once it is written: offline-ready and update notices, plus "keep a file copy too"
  function pwaScript(SRC) {
    var note = function (msg, btnText, onBtn) { var f = function () { if (window.FSA && FSA.toast) FSA.toast(msg); else console.log(msg); if (btnText) showBtn(msg, btnText, onBtn); }; if (window.FSA) f(); else setTimeout(f, 1500); };
    var showBtn = function (msg, btnText, onBtn) { var d = document.createElement('div'); d.setAttribute('style', 'position:fixed;left:12px;right:12px;bottom:72px;z-index:9998;background:#0d5c40;color:#fff;border-radius:12px;padding:12px 14px;font:15px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.3)'); d.innerHTML = '<div>' + msg + '</div><div style="margin-top:8px;display:flex;gap:8px"><button type="button" style="font:inherit;padding:8px 12px;border-radius:9px;border:0;background:#f2a900;color:#000;font-weight:700">' + btnText + '</button><button type="button" style="font:inherit;padding:8px 12px;border-radius:9px;border:1px solid #fff;background:transparent;color:#fff">Later</button></div>'; var bs = d.querySelectorAll('button'); bs[0].onclick = function () { onBtn(); d.remove(); }; bs[1].onclick = function () { d.remove(); }; document.body.appendChild(d); };
    // save the atlas as a plain file on this phone as well, so there is a copy nothing can evict (Files/Downloads)
    window.FSA_saveFile = async function () {
      try { var r = await fetch(SRC); var b = await r.blob(); var u = URL.createObjectURL(new Blob([b], { type: 'text/html' })); var a = document.createElement('a'); a.href = u; a.download = 'Survival-Atlas.html'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000); try { localStorage.setItem('fsa.fileSaved', '1'); } catch (e) {} if (window.FSA && FSA.toast) FSA.toast('Saving Survival-Atlas.html to this phone (Downloads).'); } catch (e) { if (window.FSA && FSA.toast) FSA.toast('Could not save the file: ' + e.message); }
    };
    var addAboutButton = function () { var about = document.getElementById('tab-about'); if (!about || document.getElementById('fsaSaveBtn')) return; var p = document.createElement('p'); p.innerHTML = '<button id="fsaSaveBtn" type="button" class="pri">Save the atlas file to this phone too (29 MB)</button> <span class="small muted">A plain copy in Files/Downloads that works even if this app is ever cleared.</span>'; var h = about.querySelector('h2'); if (h && h.nextSibling) h.parentNode.insertBefore(p, h.nextSibling.nextSibling || null); else about.prepend(p); document.getElementById('fsaSaveBtn').onclick = window.FSA_saveFile; };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addAboutButton); else addAboutButton();
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data === 'cached') { var saved = false; try { saved = localStorage.getItem('fsa.fileSaved') === '1'; } catch (x) {} note('Saved for offline use. This atlas now works with no signal.' + (saved ? '' : ' Keep a plain file copy on this phone as well?'), saved ? '' : 'Save file (29 MB)', window.FSA_saveFile); }
    });
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (window.__fsaHadSW) note('A newer atlas is ready. Close it fully and reopen to use it.'); });
    navigator.serviceWorker.ready.then(function () { window.__fsaHadSW = true; });
    var standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent) && !localStorage.getItem('fsa.a2hs')) { setTimeout(function () { note('iPhone: tap Share, then "Add to Home Screen" to keep this atlas as an app.'); try { localStorage.setItem('fsa.a2hs', '1'); } catch (e) {} }, 4000); }
    if (!standalone && /Android/.test(navigator.userAgent) && !localStorage.getItem('fsa.a2hs')) { setTimeout(function () { note('Android: Chrome menu → "Install app" (or "Add to Home screen") to keep this atlas as an app.'); try { localStorage.setItem('fsa.a2hs', '1'); } catch (e) {} }, 4000); }
  }
  function concat(chunks, n) { var out = new Uint8Array(n), o = 0; for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; } return out; }
})();
</script>
</body>
</html>
